<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=[1,2,3,4,5,6]
        var sum=0
        for(i=0;i<a.length;i++){
            sum+=a[i]
        }

        for(i=a.length-1;i>=0;i--){
            sum+=a[i]
        }

        for(i=0;i<a.length;i+=2){
            if(i==a.length-1){
                sum+=a[i]
            }
            else{
                sum+=a[i]+a[i+1]
            }
        }

        var sum=a.reduce((s,ele)=>{
            return s+ele
        },0)
        
        console.log(sum)
    </script>
</body>
</html>
