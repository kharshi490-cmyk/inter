<body>
    <script>
        var a=[1,2,3,4,5,6];
        var b=[]
        var i=0 
        var j=a.length-1
        var temp;
        console.log(a.reverse());
       
        for(i=a.length-1;i>=0;i--){
            b.push(a[i]);
        }

        for(i=0;i<5;i++){
            b[i]=a.pop()
        }

        while(i<j){
            temp=a[i]
            a[i]=a[j]
            a[j]=temp
            i++
            j--
        }

        for(i=0;i<(a.length)/2;i++){
            temp=a[i]
            a[i]=a[a.length-1-i]
            a[a.length-1-i]=temp
        }

        console.log(a)
    </script>
